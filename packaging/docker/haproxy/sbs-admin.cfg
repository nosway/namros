global
  log stdout format raw local0

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 3s
  timeout client 60s
  timeout server 60s

frontend sbs_admin
  bind *:9443
  default_backend sbs_admin_services

backend sbs_admin_services
  option httpchk GET /readyz
  http-check expect status 200
  server sbs-service-1 sbs-service-1:9443 check port 9081 inter 2s fall 3 rise 2
  server sbs-service-2 sbs-service-2:9443 check port 9081 inter 2s fall 3 rise 2
