global
  log stdout format raw local0

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 3s
  timeout client 60s
  timeout server 60s

frontend sbs_data
  bind *:9444
  default_backend sbs_data_nodes

backend sbs_data_nodes
  option tcp-check
  server sbs-data-1 sbs-data-1:9444 check inter 2s fall 3 rise 2
  server sbs-data-2 sbs-data-2:9444 check inter 2s fall 3 rise 2
  server sbs-data-3 sbs-data-3:9444 check inter 2s fall 3 rise 2
  server sbs-data-4 sbs-data-4:9444 check inter 2s fall 3 rise 2
