global
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 60s
  timeout server 60s

frontend s3
  bind *:9000
  default_backend namros_gateways

backend namros_gateways
  option httpchk GET /readyz
  http-check expect status 200
  server namros-gateway-a namros-gateway-a:9000 check inter 2s fall 3 rise 2
  server namros-gateway-b namros-gateway-b:9000 check inter 2s fall 3 rise 2
