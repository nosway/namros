{{- if .Values.rootCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "namros.secretName" . }}
  labels:
    {{- include "namros.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.rootCredentials.accessKeyKey }}: {{ .Values.rootCredentials.accessKeyId | quote }}
  {{ .Values.rootCredentials.secretAccessKeyKey }}: {{ .Values.rootCredentials.secretAccessKey | quote }}
{{- end }}
