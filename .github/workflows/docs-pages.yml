name: Docs

# The manual set is render-checked from docs-src on every push to main. GitHub
# The public Pages site is deployed explicitly through workflow_dispatch after
# the render check passes. Push CI remains independent from deployment state.
# No rendered HTML is committed to the repository, so the Markdown sources
# cannot drift from what readers see.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy the rendered documentation to GitHub Pages"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A superseded run has nothing worth finishing; the next one repeats the same
# render-check or explicit deploy path.
concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install documentation toolchain
        run: python -m pip install -r docs-src/requirements.txt

      - name: Build and render-check the site
        run: make docs-render-check

  deploy-pages:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages }}
    needs: render-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install documentation toolchain
        run: python -m pip install -r docs-src/requirements.txt

      - name: Build and render-check the site
        run: make docs-render-check

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
