name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.4
        required: true

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      SYFT_VERSION: 1.51.0
      SYFT_LINUX_AMD64_SHA256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5

      - name: Install syft
        run: |
          mkdir -p "$HOME/.local/bin"
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}" \
            -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' \
            "$SYFT_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" syft
          syft version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve release metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          namrbd_version="$(awk '$1 == "github.com/nosway/namrbd" { print $2; exit }' go.mod)"
          test -n "$namrbd_version"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_namespace="ghcr.io/${owner}"
          echo "NAMROS_VERSION=$version" >> "$GITHUB_ENV"
          echo "NAMROS_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "NAMROS_BUILD_DATE=$build_date" >> "$GITHUB_ENV"
          echo "NAMRBD_VERSION=$namrbd_version" >> "$GITHUB_ENV"
          echo "NAMROS_GATEWAY_IMAGE=${image_namespace}/namros-gateway" >> "$GITHUB_ENV"
          echo "NAMROS_TOOLS_IMAGE=${image_namespace}/namros-tools" >> "$GITHUB_ENV"

      - name: Build Community binaries
        run: |
          GOOS=linux GOARCH=amd64 make build-community
          mkdir -p dist
          tar -czf "dist/namros-${NAMROS_VERSION}-linux-amd64.tar.gz" -C bin/community .

      - name: Package Helm chart
        run: |
          NAMROS_HELM_REQUIRE_HELM=true make helm-chart-check
          helm package packaging/helm/namros-community \
            --version "${NAMROS_VERSION#v}" \
            --app-version "$NAMROS_VERSION" \
            --destination dist

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Publish gateway image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: packaging/docker/Dockerfile.gateway
          build-contexts: |
            namrbd=https://github.com/nosway/namrbd.git#${{ env.NAMRBD_VERSION }}
          push: true
          build-args: |
            NAMROS_VERSION=${{ env.NAMROS_VERSION }}
            NAMROS_COMMIT=${{ env.NAMROS_COMMIT }}
            NAMROS_BUILD_DATE=${{ env.NAMROS_BUILD_DATE }}
          tags: |
            ${{ env.NAMROS_GATEWAY_IMAGE }}:${{ env.NAMROS_VERSION }}
            ${{ env.NAMROS_GATEWAY_IMAGE }}:latest

      - name: Publish tools image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: packaging/docker/Dockerfile.tools
          build-contexts: |
            namrbd=https://github.com/nosway/namrbd.git#${{ env.NAMRBD_VERSION }}
          push: true
          build-args: |
            NAMROS_VERSION=${{ env.NAMROS_VERSION }}
            NAMROS_COMMIT=${{ env.NAMROS_COMMIT }}
            NAMROS_BUILD_DATE=${{ env.NAMROS_BUILD_DATE }}
          tags: |
            ${{ env.NAMROS_TOOLS_IMAGE }}:${{ env.NAMROS_VERSION }}
            ${{ env.NAMROS_TOOLS_IMAGE }}:latest

      - name: Write checksums, SBOM, and provenance
        run: |
          artifacts="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tgz' \) | sort | tr '\n' ' ')"
          NAMROS_RELEASE_VERSION="$NAMROS_VERSION" \
            NAMROS_RELEASE_EDITION=community \
            NAMROS_RELEASE_ARTIFACTS="$artifacts" \
            NAMROS_RELEASE_REQUIRE_ARTIFACTS=1 \
            NAMROS_RELEASE_GENERATE_SBOM=1 \
            NAMROS_RELEASE_IMAGE_REFS="${NAMROS_GATEWAY_IMAGE}:${NAMROS_VERSION} ${NAMROS_TOOLS_IMAGE}:${NAMROS_VERSION}" \
            scripts/release/write-release-artifact-metadata.sh
          cp dist/release-metadata/checksums.sha256 dist/checksums.sha256

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.tgz
            dist/checksums.sha256

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: namros-${{ env.NAMROS_VERSION }}-release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.tgz
            dist/checksums.sha256
            dist/release-metadata/**

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.NAMROS_VERSION }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tgz
            dist/checksums.sha256
            dist/release-metadata/**
