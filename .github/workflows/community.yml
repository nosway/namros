name: Community

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  community-boundary:
    name: Community boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Community source boundary
        run: make check-community-export

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install documentation toolchain
        run: python -m pip install -r docs-src/requirements.txt

      - name: Build and render-check the site
        run: make docs-render-check

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5

      - name: Lint and render chart
        run: NAMROS_HELM_REQUIRE_HELM=true make helm-chart-check

  s3-compatibility:
    name: Public S3 compatibility
    runs-on: ubuntu-latest
    env:
      MINIO_MC_VERSION: RELEASE.2025-08-13T08-35-41Z
      MINIO_MC_LINUX_AMD64_SHA256: 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891
      NAMROS_COMPAT_AUTOSTART_GATEWAY: "1"
      NAMROS_COMPAT_GATEWAY_START_TIMEOUT_SECONDS: "60"
      NAMROS_COMPAT_MC_LARGE_OBJECT_MIB: "70"
      NAMROS_COMPAT_RCLONE_LARGE_OBJECT_MIB: "2"
      NAMROS_COMPAT_RCLONE_UPLOAD_CUTOFF: "1Mi"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install S3 clients
        run: |
          set -euo pipefail
          python -m pip install awscli
          sudo apt-get update
          sudo apt-get install -y curl jq rclone
          mc_asset="mc.linux-amd64.${MINIO_MC_VERSION}"
          mc_url="https://github.com/minio/mc/releases/download/${MINIO_MC_VERSION}/${mc_asset}"
          curl --fail --silent --show-error --location --retry 3 \
            "$mc_url" -o "$RUNNER_TEMP/$mc_asset"
          printf '%s  %s\n' \
            "$MINIO_MC_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$mc_asset" \
            | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/$mc_asset" /usr/local/bin/mc
          aws --version
          mc --version
          rclone version

      - name: Run public S3 compatibility smoke
        run: make compat-public-s3

  publication:
    name: Publication readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check publication metadata
        run: make check-publication-readiness
