site_name: NAMROS Community
site_description: NAMROS Community S3-compatible object storage documentation
site_url: https://nosway.github.io/namros/
repo_url: https://github.com/nosway/namros
docs_dir: docs-src
site_dir: site

# Build inputs that live beside the sources but must not ship in the site.
exclude_docs: |
  requirements.txt

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - assets/namros-docs.css

nav:
  - Home: index.md
  - Manuals:
      - NAMROS: manuals/index.md
      - NAMROS Integrated CLI Command Reference: manuals/admin-cli-reference.md
      - NAMROS Administrator Guide: manuals/admin-guide.md
      - NAMROS Capacity Scaling & Maintenance Guide: manuals/capacity-scaling-maintenance-guide.md
      - NAMROS Community Container Deployment Guide: manuals/container-deployment-guide.md
      - etcd HA Installation & Operations Guide: manuals/etcd-ha-cluster-install-operations-guide.md
      - NAMROS Event Notifications Guide: manuals/event-notification-guide.md
      - NAMROS IAM Integration Guide: manuals/iam-integration-guide.md
      - NAMROS Installation Guide: manuals/installation-guide.md
      - NAMROS Inventory & Batch Operations Guide: manuals/inventory-batch-operations-guide.md
      - NAMROS KMS Encryption Guide: manuals/kms-encryption-guide.md
      - NAMROS MCP Operations Guide: manuals/mcp-operations-guide.md
      - NAMROS Performance/Chaos/Soak Guide: manuals/performance-chaos-soak-guide.md
      - NAMROS Quota and QoS Guide: manuals/quota-qos-guide.md
      - NAMROS Replication & Disaster Recovery Guide: manuals/replication-disaster-recovery-guide.md
      - S3 Client Compatibility Guide: manuals/s3-client-compatibility-guide.md
      - S3 Object Browser Integration Guide: manuals/s3-object-browser-integration-guide.md
      - TiKV HA Installation & Operations Guide: manuals/tikv-ha-cluster-install-operations-guide.md
      - NAMROS Upgrade & Release Operations Guide: manuals/upgrade-release-operations-guide.md
