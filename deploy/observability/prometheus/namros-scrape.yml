global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: namros-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - namros-gateway-a:19090
          - namros-gateway-b:19090
          - namros-gateway-c:19090
          - namros-gateway-d:19090
        labels:
          cluster: namros-community

  # SBS storage semantics are owned by NAMRBD. NAMROS consumes this read-only
  # source directly or through namros-sbs-exporter when a local proxy is useful.
  - job_name: namrbd-sbs-observability
    metrics_path: /metrics
    static_configs:
      - targets:
          - namrbd-sbs-observability:19110
        labels:
          cluster: namros-community
          source_authority: namrbd_sbs_observability

remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    queue_config:
      max_samples_per_send: 10000
      capacity: 20000
      max_shards: 8
