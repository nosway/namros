<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="title desc">
  <title id="title">Stateless gateway ownership</title>
  <desc id="desc">Gateway replicas use local cache only, while metadata and registry state are authoritative elsewhere.</desc>
  <rect width="980" height="320" fill="#fff"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#566372"/></marker></defs>
  <style>.b{fill:#eef4f7;stroke:#0b6b8f;stroke-width:2}.e{fill:#fff3e8;stroke:#9b3d36;stroke-width:2}.t{font:700 15px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#17202a}.s{font:12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#566372}.l{stroke:#566372;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect class="b" x="40" y="120" width="150" height="70" rx="8"/><text class="t" x="77" y="150">Clients</text><text class="s" x="65" y="172">S3 requests</text>
  <rect class="b" x="260" y="54" width="150" height="86" rx="8"/><text class="t" x="304" y="86">Gateway A</text><text class="s" x="282" y="110">cache is local</text>
  <rect class="b" x="260" y="180" width="150" height="86" rx="8"/><text class="t" x="304" y="212">Gateway B</text><text class="s" x="282" y="236">cache is local</text>
  <rect class="b" x="520" y="74" width="180" height="82" rx="8"/><text class="t" x="564" y="106">Metadata</text><text class="s" x="558" y="130">authoritative objects</text>
  <rect class="e" x="520" y="190" width="180" height="82" rx="8"/><text class="t" x="576" y="222">etcd</text><text class="s" x="552" y="246">gateway registry</text>
  <rect class="b" x="780" y="118" width="150" height="82" rx="8"/><text class="t" x="818" y="150">Storage</text><text class="s" x="805" y="174">payload bytes</text>
  <line class="l" x1="190" y1="154" x2="260" y2="98"/><line class="l" x1="190" y1="158" x2="260" y2="224"/>
  <line class="l" x1="410" y1="98" x2="520" y2="112"/><line class="l" x1="410" y1="224" x2="520" y2="118"/>
  <line class="l" x1="410" y1="112" x2="520" y2="224"/><line class="l" x1="410" y1="238" x2="520" y2="238"/>
  <line class="l" x1="700" y1="116" x2="780" y2="154"/>
</svg>

