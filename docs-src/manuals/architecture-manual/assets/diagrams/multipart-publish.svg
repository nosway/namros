<svg xmlns="http://www.w3.org/2000/svg" width="980" height="240" viewBox="0 0 980 240" role="img" aria-labelledby="title desc">
  <title id="title">Multipart publish sequence</title>
  <desc id="desc">Multipart parts are stored before object visibility; complete publishes the manifest.</desc>
  <rect width="980" height="240" fill="#fff"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#566372"/></marker></defs>
  <style>.b{fill:#eef4f7;stroke:#0b6b8f;stroke-width:2}.g{fill:#f1f7ef;stroke:#176b52;stroke-width:2}.t{font:700 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#17202a}.s{font:12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#566372}.l{stroke:#566372;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect class="b" x="32" y="76" width="128" height="80" rx="8"/><text class="t" x="68" y="108">Initiate</text><text class="s" x="55" y="132">MPU record</text>
  <rect class="b" x="210" y="76" width="128" height="80" rx="8"/><text class="t" x="246" y="108">Upload</text><text class="s" x="235" y="132">part refs</text>
  <rect class="b" x="388" y="76" width="128" height="80" rx="8"/><text class="t" x="424" y="108">Validate</text><text class="s" x="414" y="132">ETag/order</text>
  <rect class="g" x="566" y="76" width="128" height="80" rx="8"/><text class="t" x="604" y="108">Commit</text><text class="s" x="588" y="132">manifest publish</text>
  <rect class="g" x="744" y="76" width="168" height="80" rx="8"/><text class="t" x="795" y="108">Visible</text><text class="s" x="780" y="132">GET/HEAD/LIST</text>
  <line class="l" x1="160" y1="116" x2="210" y2="116"/><line class="l" x1="338" y1="116" x2="388" y2="116"/><line class="l" x1="516" y1="116" x2="566" y2="116"/><line class="l" x1="694" y1="116" x2="744" y2="116"/>
</svg>

