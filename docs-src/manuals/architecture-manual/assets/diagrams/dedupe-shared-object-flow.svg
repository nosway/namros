<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Dedupe shared object flow</title>
  <desc id="desc">Enterprise dedupe scans immutable object versions, verifies bytes, publishes a shared object, attaches refs, and gates reclaim through protected refs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176b52"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#d7e0e7;stroke-width:2;rx:8}
      .ent{fill:#fff7f4;stroke:#9b3d36;stroke-width:2;rx:8}
      .ok{fill:#f3fbf7;stroke:#176b52;stroke-width:2;rx:8}
      .txt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px;fill:#17202a}
      .small{font-size:14px;fill:#566372}
      .arrow{stroke:#176b52;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#9b3d36;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="24" y="24" width="1032" height="512" rx="14" fill="#f6f8fb" stroke="#d7e0e7"/>
  <text x="54" y="64" class="txt" font-weight="700">Enterprise dedupe does not change S3-visible semantics</text>
  <text x="54" y="88" class="small">Hash finds candidates; byte verification and metadata publish create shared object authority.</text>

  <rect class="box" x="64" y="142" width="200" height="96"/>
  <text x="88" y="176" class="txt" font-weight="700">ObjectVersion A</text>
  <text x="88" y="200" class="small">private SegmentRef</text>
  <text x="88" y="220" class="small">digest + length</text>

  <rect class="box" x="64" y="302" width="200" height="96"/>
  <text x="88" y="336" class="txt" font-weight="700">ObjectVersion B</text>
  <text x="88" y="360" class="small">private SegmentRef</text>
  <text x="88" y="380" class="small">same candidate key</text>

  <rect class="ent" x="336" y="216" width="210" height="108"/>
  <text x="360" y="250" class="txt" font-weight="700">Plan Candidates</text>
  <text x="360" y="274" class="small">same tenant</text>
  <text x="360" y="294" class="small">same encryption scope</text>
  <text x="360" y="314" class="small">same digest/length</text>

  <path class="dash" d="M264 190 C302 190 302 250 336 250"/>
  <path class="dash" d="M264 350 C302 350 302 290 336 290"/>

  <rect class="ent" x="610" y="216" width="206" height="108"/>
  <text x="634" y="250" class="txt" font-weight="700">Byte Verify</text>
  <text x="634" y="274" class="small">read through storage</text>
  <text x="634" y="294" class="small">compare full bytes</text>
  <text x="634" y="314" class="small">hash alone denied</text>
  <path class="dash" d="M546 270 H610"/>

  <rect class="ok" x="880" y="118" width="166" height="104"/>
  <text x="902" y="152" class="txt" font-weight="700">SharedObject</text>
  <text x="902" y="176" class="small">published after</text>
  <text x="902" y="196" class="small">byte verify</text>

  <rect class="ok" x="880" y="308" width="166" height="104"/>
  <text x="902" y="342" class="txt" font-weight="700">Attach Refs</text>
  <text x="902" y="366" class="small">rewrite manifest</text>
  <text x="902" y="386" class="small">old refs to GC</text>

  <path class="arrow" d="M816 252 C852 224 852 172 880 170"/>
  <path class="arrow" d="M963 222 V308"/>

  <rect class="box" x="338" y="438" width="414" height="68"/>
  <text x="360" y="468" class="txt" font-weight="700">Protected-root accounting gates reclaim</text>
  <text x="360" y="492" class="small">Old private segments are deleted only after manifest reachability and protected refs allow it.</text>
  <path class="arrow" d="M880 380 C760 430 650 448 752 472"/>
</svg>
